<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244c8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Réservations">
<title>Salle des fêtes · Réservations</title>
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#16202b; --muted:#5f6b78; --line:#d9dee5; --soft:#e8ecf1;
  --pri:#244c8a; --onpri:#ffffff; --wait:#d99a00; --bad:#c8362b; --ok:#2b7a4b;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f151c; --card:#18212b; --ink:#e6ebf0; --muted:#9aa6b3; --line:#2b3746; --soft:#212c39;
    --pri:#7ea6e0; --onpri:#0d1826; --wait:#e8b23a; --bad:#f0857c; --ok:#63b98a;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;max-width:920px;margin:0 auto;background:var(--bg)}
header.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
header.top h1{font:600 19px/1.2 var(--serif);margin:0;flex:1}
header.top small{display:block;font:400 12px var(--sans);color:var(--muted)}
main{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:12px 4px;border:0;background:none;color:var(--muted);font-weight:600;border-top:3px solid transparent}
nav.tabs button.on{color:var(--pri);border-top-color:var(--pri)}
h2{font:600 22px/1.2 var(--serif);margin:0 0 12px}
h3{font:600 17px/1.2 var(--serif);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.keep{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],input[type=datetime-local],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:44px}
textarea{min-height:120px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;min-height:44px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--pri)}
/* Calendrier */
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthbar h2{flex:1;margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card)}
.cal .dow{padding:6px 2px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{display:flex;flex-direction:column;gap:3px;min-height:64px;padding:4px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);text-align:left}
.day.empty{background:var(--soft);cursor:default}
.day .n{font-size:14px;font-weight:600}
.day.today .n{display:inline-block;background:var(--pri);color:var(--onpri);border-radius:10px;padding:0 6px;align-self:flex-start}
.bar{display:block;height:13px;border-radius:2px;background:var(--soft);font-size:9px;line-height:13px;text-align:center;font-weight:700;color:transparent}
.bar.busy{background:var(--pri);color:var(--onpri)}
.bar.wait{background:repeating-linear-gradient(135deg,var(--wait) 0 4px,transparent 4px 8px);color:var(--ink);box-shadow:inset 0 0 0 1px var(--wait)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.legend i.busy{background:var(--pri)}
.legend i.wait{background:repeating-linear-gradient(135deg,var(--wait) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--wait)}
.legend i.free{background:var(--soft)}
/* Liste */
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid currentColor}
.pill.wait{color:var(--wait)} .pill.confirmee{color:var(--pri)} .pill.annulee{color:var(--muted)}
.prog{height:5px;background:var(--soft);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats b{display:block;font:600 24px/1.1 var(--serif)}
/* Feuille (jour) */
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:920px;max-height:80%;overflow:auto;background:var(--card);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.alert{border:1px solid var(--bad);border-left-width:5px;border-radius:8px;padding:10px 12px;margin-bottom:14px;color:var(--bad);background:var(--card)}
.note{border-left:4px solid var(--wait);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;margin-bottom:14px}
.sticky{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.sticky h1{flex:1;font:600 18px var(--serif);margin:0}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.rec{font:700 22px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-align:center;padding:14px;border:2px dashed var(--pri);border-radius:8px;margin:14px 0;word-break:break-all}
.lock{max-width:440px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) 20px 32px}
.lock h1{font:600 26px/1.2 var(--serif);margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
#print{display:none}
.viewer{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg)}
.viewer iframe{flex:1;border:0;background:#fff;width:100%}
@media print{.viewer{display:none!important}}
@media print{
  html,body{background:#fff;height:auto}
  body>#app,#toast{display:none!important}
  #print{display:block;color:#000;background:#fff;font:12pt/1.5 Georgia,"Times New Roman",serif}
  #print h1{font-size:17pt;text-align:center;margin:0 0 4pt}
  #print .sig{display:flex;gap:40px;margin-top:36pt}
  #print .sig div{flex:1;min-height:90pt;border-top:1px solid #000;padding-top:4pt}
  #print .body{white-space:pre-wrap}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<body>
<div id="app"></div>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pdfIn" accept="application/pdf,.pdf,text/html,.html,.htm" multiple hidden>
<input type="file" id="restoreIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const enc=new TextEncoder(), dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDT=s=>{const d=new Date(s);return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' '+pad(d.getHours())+'h'+pad(d.getMinutes());};
const fmtLong=s=>{const d=new Date(s);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' à '+pad(d.getHours())+'h'+pad(d.getMinutes());};
const eur=n=>(Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++)t=t[k[i]];t[k[k.length-1]]=v;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800);}
function toB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function fromB64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}
function download(name,data,type){const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);}

/* ============ Stockage local (IndexedDB) ============ */
const IDB=new Promise((res,rej)=>{const r=indexedDB.open('sdf-reservations',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=async(mode,fn)=>{const d=await IDB;return new Promise((res,rej)=>{const t=d.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});};
const kvGet=k=>tx('readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('readwrite',s=>s.put(v,k));
const kvDel=k=>tx('readwrite',s=>s.delete(k));
const kvKeys=()=>tx('readonly',s=>s.getAllKeys());
const kvClear=()=>tx('readwrite',s=>s.clear());

/* ============ Chiffrement (AES-GCM, clé protégée par code + code de récupération) ============ */
async function derive(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,data){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);const o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return o.buffer;}
async function unseal(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
const normRec=s=>s.replace(/[\s-]/g,'').toUpperCase();
function genRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(20));let s='';r.forEach((b,i)=>{s+=A[b%32];if(i%5===4&&i<19)s+='-';});return s;}
const importKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);

async function wrapMeta(raw,pw,rec,oldMeta){
  const meta=oldMeta?{...oldMeta}:{};
  if(pw!=null){const s=crypto.getRandomValues(new Uint8Array(16));meta.sP=toB64(s);meta.wP=toB64(await seal(await derive(pw,s),raw));}
  if(rec!=null){const s=crypto.getRandomValues(new Uint8Array(16));meta.sR=toB64(s);meta.wR=toB64(await seal(await derive(normRec(rec),s),raw));}
  await kvSet('meta',meta);return meta;
}
async function setupCode(pw){
  const raw=await crypto.subtle.exportKey('raw',await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']));
  const rec=genRecovery();
  S.meta=await wrapMeta(raw,pw,rec);S.raw=raw;S.key=await importKey(raw);S.db=defaultDb();await saveDb();return rec;
}
async function loadWith(raw){
  S.raw=raw;S.key=await importKey(raw);
  const d=await kvGet('data');S.db=d?JSON.parse(dec.decode(await unseal(S.key,d))):defaultDb();migrate();
}
async function tryUnlock(pw){
  try{const raw=await unseal(await derive(pw,new Uint8Array(fromB64(S.meta.sP))),fromB64(S.meta.wP));await loadWith(raw);return true;}catch(e){return false;}
}
async function tryRecover(rec,newPw){
  try{const raw=await unseal(await derive(normRec(rec),new Uint8Array(fromB64(S.meta.sR))),fromB64(S.meta.wR));
    S.meta=await wrapMeta(raw,newPw,null,S.meta);await loadWith(raw);return true;}catch(e){return false;}
}
async function saveDb(){S.dirty=false;await kvSet('data',await seal(S.key,enc.encode(JSON.stringify(S.db))));}
function flush(){if(S.dirty&&S.key&&S.db)saveDb();}
function lockNow(){flush();S.key=null;S.raw=null;S.db=null;S.edit=null;S.sheet=null;S.lock='unlock';render();}

/* ============ Données ============ */
const DEFAULT_CONTRAT=`Entre la commune de {{commune}}, représentée par {{signataire}}, ci-après « la commune »,
et {{nom}}, demeurant {{adresse}}, téléphone {{tel}}, e-mail {{email}}, ci-après « le locataire ».

Article 1 – Objet
La commune met à disposition du locataire : {{salles}}, pour l'événement suivant : {{type}}.

Article 2 – Durée
La location court du {{debut}} au {{fin}}. Le locataire libère les lieux à l'heure de fin indiquée, salle rangée et nettoyée.

Article 3 – Tarif
Location : {{loyer}}. Options ({{options}}) : {{optionsPrix}}. Total à payer : {{total}}, selon les modalités indiquées par la mairie.

Article 4 – Caution
Une caution de {{caution}} est versée avant la remise des clés. Elle est restituée après l'état des lieux de sortie, déduction faite des éventuels dommages, manquements de rangement ou de nettoyage.

Article 5 – Assurance
Le locataire fournit, avant la remise des clés, une attestation d'assurance responsabilité civile couvrant la location.

Article 6 – États des lieux
Un état des lieux d'entrée et un état des lieux de sortie sont établis contradictoirement. Le locataire signale toute anomalie dès l'entrée dans les lieux.

Article 7 – Usage des locaux
Le locataire respecte la capacité d'accueil, les consignes de sécurité et le règlement intérieur de la salle, veille à la tranquillité du voisinage et s'interdit de fumer ou de vapoter dans les locaux. Toute sous-location est interdite.

Article 8 – Responsabilité
Le locataire répond des dommages causés aux locaux, au mobilier et au matériel pendant la durée de la location. La commune décline toute responsabilité en cas de vol ou de dégradation des biens apportés par le locataire.

Article 9 – Annulation
Toute annulation est signalée à la mairie dans les meilleurs délais. Les conditions de remboursement sont celles fixées par la commune.

Article 10 – Données personnelles
Les informations recueillies sont utilisées uniquement pour la gestion de la location. Elles sont accessibles au seul personnel habilité de la mairie et conservées jusqu'à la restitution de la caution, puis supprimées ou anonymisées, hors pièces comptables. Le locataire peut exercer ses droits d'accès, de rectification et d'effacement auprès de la mairie{{contact}}.`;

const defaultDb=()=>({v:1,settings:{
  commune:'Pasly',signataire:'',mairieContact:'',
  edlUrl:'https://f07303988-hub.github.io/etat-des-lieux-numerique/',agentContact:'',
  salles:[
    {id:'grande',nom:'Grande salle',court:'G',jHab:0,jExt:0,wHab:0,wExt:0,caution:0},
    {id:'petite',nom:'Petite salle',court:'P',jHab:0,jExt:0,wHab:0,wExt:0,caution:0}],
  ensemble:{jHab:0,jExt:0,wHab:0,wExt:0,caution:0},
  options:[{id:'chauffage',nom:'Chauffage',prix:0},{id:'vaisselle',nom:'Vaisselle',prix:0},{id:'menage',nom:'Ménage',prix:0}],
  contrat:DEFAULT_CONTRAT,retention:12},
  resas:[]});
function migrate(){
  const d=defaultDb();S.db.settings=Object.assign(d.settings,S.db.settings);
  S.db.resas.forEach(r=>{r.etapes=Object.assign({contrat:false,assurance:false,cautionRecue:false,edlEntree:false,edlSortie:false,cautionRendue:false},r.etapes);r.pdfs=r.pdfs||[];r.options=r.options||[];});
}
const ETAPES=[['contrat','Contrat signé'],['assurance','Attestation d’assurance reçue'],['cautionRecue','Caution reçue'],['edlEntree','État des lieux d’entrée'],['edlSortie','État des lieux de sortie'],['cautionRendue','Caution rendue']];
const STATUTS={demande:'En attente',confirmee:'Réservée',annulee:'Annulée'};
const TYPES=['Mariage','Anniversaire','Repas de famille','Association','Réunion','Autre'];
const salleOf=id=>S.db.settings.salles.find(s=>s.id===id);
const salleNames=r=>r.salles.map(id=>salleOf(id)?.nom||id).join(' + ');

function newResa(day){
  const d=day||ymd(new Date());
  return{id:uid(),num:'',salles:['grande'],debut:d+'T10:00',fin:d+'T22:00',type:'Repas de famille',nb:null,
    demandeur:{nom:'',adresse:'',tel:'',email:''},hab:'hab',options:[],loyerManuel:null,cautionManuelle:null,
    statut:'demande',etapes:{contrat:false,assurance:false,cautionRecue:false,edlEntree:false,edlSortie:false,cautionRendue:false},notes:'',pdfs:[],created:new Date().toISOString()};
}
function nextNum(year){
  let max=0;S.db.resas.forEach(r=>{const m=r.num.match(new RegExp('^SDF-'+year+'-(\\d+)$'));if(m)max=Math.max(max,+m[1]);});
  return `SDF-${year}-${String(max+1).padStart(3,'0')}`;
}
function nbJours(r){
  const a=new Date(r.debut),b=new Date(r.fin);
  const d0=new Date(a.getFullYear(),a.getMonth(),a.getDate()),d1=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.max(1,Math.round((d1-d0)/864e5)+1);
}
const isEnsemble=r=>{const s=S.db.settings;return s.salles.length>1&&r.salles.length===s.salles.length;};
const ensembleSet=e=>!!(e.jHab||e.jExt||e.wHab||e.wExt||e.caution);
function money(r){
  const s=S.db.settings,n=nbJours(r);let auto=0,cAuto=0,label;
  const price=(x)=>{const j=r.hab==='hab'?x.jHab:x.jExt,w=r.hab==='hab'?x.wHab:x.wExt;return n===1?j:w+(n-2)*j;};
  if(isEnsemble(r)&&ensembleSet(s.ensemble)){
    auto=price(s.ensemble);cAuto=s.ensemble.caution||0;label='tarif « '+salleNames(r)+' » (les deux ensemble)';
  }else{
    r.salles.forEach(id=>{const x=salleOf(id);if(!x)return;auto+=price(x);cAuto+=x.caution||0;});
    label=r.salles.length>1?'somme des tarifs de chaque salle (tarif ensemble non renseigné)':'tarif « '+salleNames(r)+' »';
  }
  const opt=r.options.reduce((t,id)=>t+(s.options.find(o=>o.id===id)?.prix||0),0);
  const base=r.loyerManuel??auto;
  return{auto,base,opt,total:base+opt,cAuto,caution:r.cautionManuelle??cAuto,label};
}
function conflicts(r){
  const a=+new Date(r.debut),b=+new Date(r.fin);
  return S.db.resas.filter(o=>o.id!==r.id&&o.statut!=='annulee'&&o.salles.some(x=>r.salles.includes(x))&&+new Date(o.debut)<b&&+new Date(o.fin)>a);
}
const progress=r=>Object.values(r.etapes).filter(Boolean).length/ETAPES.length;

/* ============ État de l'application ============ */
const S={key:null,raw:null,db:null,meta:null,dirty:false,tab:'cal',lock:'unlock',rec:null,sheet:null,edit:null,newFiles:[],delFiles:[],pdfTarget:'auto',
  month:(()=>{const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d;})(),
  filt:{year:String(new Date().getFullYear()),statut:'',q:''}};

/* ============ Vues ============ */
function lockView(){
  const warn=`<p class="note small">Sans ce code ni le code de récupération, les données ne peuvent pas être retrouvées. Le code n’est enregistré nulle part.</p>`;
  if(S.lock==='setup')return`<div class="lock"><h1>Réservations de la salle des fêtes</h1><p class="muted">Choisissez un code d’accès. Il chiffre toutes les fiches sur cet appareil.</p>
    <label class="f" for="pw1">Code d’accès (8 caractères minimum)</label><input type="password" id="pw1" autocomplete="new-password">
    <label class="f" for="pw2">Confirmer le code</label><input type="password" id="pw2" autocomplete="new-password">
    ${warn}<button class="btn pri" style="width:100%" data-act="setup">Créer le code d’accès</button></div>`;
  if(S.lock==='showrec')return`<div class="lock"><h1>Code de récupération</h1><p>Notez ce code sur papier et rangez-le en lieu sûr. Il permet de rouvrir les données si le code d’accès est oublié. Il ne sera plus affiché.</p>
    <div class="rec">${esc(S.rec)}</div>
    <button class="btn" style="width:100%;margin-bottom:12px" data-act="printRec">Imprimer le code</button>
    <label class="chk"><input type="checkbox" id="recok"><span>J’ai noté et rangé le code de récupération</span></label>
    <button class="btn pri" style="width:100%;margin-top:8px" data-act="recDone">Ouvrir l’application</button></div>`;
  if(S.lock==='recover')return`<div class="lock"><h1>Code oublié</h1><p class="muted">Saisissez le code de récupération et choisissez un nouveau code d’accès.</p>
    <label class="f" for="rec">Code de récupération</label><input type="text" id="rec" autocomplete="off" autocapitalize="characters" class="mono">
    <label class="f" for="pwn">Nouveau code d’accès (8 caractères minimum)</label><input type="password" id="pwn" autocomplete="new-password">
    <button class="btn pri" style="width:100%;margin-top:14px" data-act="recover">Rouvrir avec le code de récupération</button>
    <button class="btn ghost" style="width:100%" data-act="goUnlock">Retour</button></div>`;
  return`<div class="lock"><h1>Réservations de la salle des fêtes</h1><p class="muted">Saisissez le code d’accès.</p>
    <label class="f" for="pw">Code d’accès</label><input type="password" id="pw" autocomplete="current-password">
    <button class="btn pri" style="width:100%;margin-top:14px" data-act="unlock">Ouvrir</button>
    <button class="btn ghost" style="width:100%" data-act="goRecover">Code oublié</button></div>`;
}

function dayState(dayStart,salleId){
  const a=+dayStart,b=a+864e5;let st='';
  S.db.resas.forEach(r=>{if(r.statut==='annulee'||!r.salles.includes(salleId))return;
    if(+new Date(r.debut)<b&&+new Date(r.fin)>a){if(r.statut==='confirmee')st='busy';else if(st!=='busy')st='wait';}});
  return st;
}
function calView(){
  const s=S.db.settings,m=S.month,y=m.getFullYear(),mo=m.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),today=ymd(new Date());
  let cells=['L','M','M','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<off;i++)cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(mo+1)}-${pad(d)}`,st=new Date(y,mo,d);
    cells+=`<button class="day${ds===today?' today':''}" data-act="day" data-d="${ds}" aria-label="${d} ${m.toLocaleDateString('fr-FR',{month:'long'})}"><span class="n">${d}</span>${s.salles.map(x=>`<i class="bar ${dayState(st,x.id)}">${esc(x.court)}</i>`).join('')}</button>`;
  }
  const noTarif=s.salles.every(x=>!x.jHab&&!x.jExt&&!x.wHab&&!x.wExt)&&!ensembleSet(s.ensemble);
  return`<div class="monthbar"><button class="btn sm" data-act="prev" aria-label="Mois précédent">‹</button><h2>${esc(m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))}</h2><button class="btn sm" data-act="today">Aujourd’hui</button><button class="btn sm" data-act="next" aria-label="Mois suivant">›</button></div>
  ${noTarif?`<div class="note small">Les tarifs ne sont pas encore renseignés. Ouvrez l’onglet Réglages pour les saisir.</div>`:''}
  <div class="cal">${cells}</div>
  <div class="legend"><span><i class="busy"></i>Réservée</span><span><i class="wait"></i>En attente</span><span><i class="free"></i>Libre</span></div>
  <p class="muted small">${s.salles.map(x=>`${esc(x.court)} = ${esc(x.nom)}`).join(' · ')}. Touchez un jour pour voir les disponibilités.</p>
  <button class="btn pri" style="width:100%;margin-top:6px" data-act="new">Nouvelle réservation</button>`;
}
function sheetView(){
  const ds=S.sheet,st=new Date(ds+'T00:00'),a=+st,b=a+864e5,s=S.db.settings;
  const rs=S.db.resas.filter(r=>r.statut!=='annulee'&&+new Date(r.debut)<b&&+new Date(r.fin)>a).sort((x,y)=>x.debut.localeCompare(y.debut));
  const lines=s.salles.map(x=>{const stt=dayState(st,x.id);return`<div class="row" style="justify-content:space-between"><span>${esc(x.nom)}</span><b>${stt==='busy'?'Réservée':stt==='wait'?'Demande en attente':'Libre'}</b></div>`;}).join('');
  return`<div class="overlay" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="Jour sélectionné">
   <h3>${esc(st.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</h3>${lines}
   ${rs.length?`<div style="margin-top:12px">${rs.map(r=>`<button class="item" data-act="open" data-id="${r.id}"><div class="r1"><b>${esc(r.num)}</b><span class="pill ${r.statut==='demande'?'wait':r.statut}">${STATUTS[r.statut]}</span></div><div>${esc(r.demandeur.nom)}</div><div class="muted small">${fmtDT(r.debut)} → ${fmtDT(r.fin)} · ${esc(salleNames(r))}</div></button>`).join('')}</div>`:''}
   <div class="row" style="margin-top:12px"><button class="btn pri grow" data-act="new" data-d="${ds}">Réserver ce jour</button><button class="btn grow" data-act="closeSheet">Fermer</button></div></div></div>`;
}

  const all=S.db.resas.filter(r=>(!f.year||r.debut.startsWith(f.year))&&(!f.statut||r.statut===f.statut)&&(!q||(r.num+' '+r.demandeur.nom+' '+r.type).toLowerCase().includes(q))).sort((a,b)=>a.debut.localeCompare(b.debut));

function render(){
  const a=$('#app');
  if(!S.key||S.lock){a.innerHTML=lockView();return;}
  if(S.edit){const y=$('main')?.scrollTop||0;a.innerHTML=ficheView();$('main').scrollTop=y;return;}
  const y=$('main')?.scrollTop||0;
  a.innerHTML=`<header class="top"><h1>Salle des fêtes<small>${esc(S.db.settings.commune)}</small></h1><button class="btn sm" data-act="lock" aria-label="Verrouiller">Verrouiller</button></header>
  <main>${S.tab==='cal'?calView():S.tab==='list'?listView():setView()}</main>
  <nav class="tabs">${[['cal','Calendrier'],['list','Réservations'],['set','Réglages']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</nav>${S.sheet?sheetView():''}`;
  $('main').scrollTop=y;
}

/* ============ Actions ============ */
function eligible(){
  const lim=new Date();lim.setMonth(lim.getMonth()-(S.db.settings.retention||12));
  return S.db.resas.filter(r=>!r.anonyme&&(r.statut==='annulee'||r.etapes.cautionRendue)&&new Date(r.fin)<lim);
}
async function attachPdf(file,r){
  const id=uid();await kvSet('f:'+id,await seal(S.key,await file.arrayBuffer()));
  const low=file.name.toLowerCase(),kind=/sortie/.test(low)?'sortie':/entr[ée]e/.test(low)?'entree':'autre';
  r.pdfs.push({id,name:file.name,kind,date:new Date().toISOString()});
  if(kind==='entree')r.etapes.edlEntree=true;if(kind==='sortie')r.etapes.edlSortie=true;return id;
}
async function openPdf(id,name){
  const buf=await unseal(S.key,await kvGet('f:'+id));
  if(/\.html?$/i.test(name)){
    // Document HTML : affiché dans un cadre isolé, sans script, séparé des données de l'appli.
    const v=document.createElement('div');v.className='viewer';
    v.innerHTML=`<div class="sticky"><button class="btn sm" data-viewer="close">Fermer</button><h1>${esc(name)}</h1><button class="btn sm" data-viewer="save">Enregistrer</button></div><iframe title="${esc(name)}" sandbox></iframe>`;
    v.querySelector('iframe').srcdoc=dec.decode(buf);
    v.addEventListener('click',e=>{const a=e.target.dataset.viewer;if(a==='close')v.remove();if(a==='save')download(name,buf,'text/html');});
    document.body.appendChild(v);return;
  }
  const url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
  const w=window.open(url,'_blank');if(!w)download(name,buf,'application/pdf');setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveResa(){
  const r=S.edit;
  if(!r.demandeur.nom.trim())return toast('Indiquez le nom du demandeur.');
  if(!r.salles.length)return toast('Choisissez au moins une salle.');
  if(!(new Date(r.fin)>new Date(r.debut)))return toast('La fin doit être après le début.');
  const c=conflicts(r);
  if(c.length&&r.statut!=='annulee'&&!confirm(`Conflit de dates avec ${c.map(x=>x.num).join(', ')}. Enregistrer quand même ?`))return;
  if(!r.num)r.num=nextNum(new Date(r.debut).getFullYear());
  const i=S.db.resas.findIndex(x=>x.id===r.id);if(i>=0)S.db.resas[i]=r;else S.db.resas.push(r);
  await saveDb();for(const id of S.delFiles)await kvDel('f:'+id);
  S.edit=null;S.newFiles=[];S.delFiles=[];render();toast('Réservation enregistrée.');
}
function edlMessage(r,t){
  const s=S.db.settings,base=s.edlUrl.replace(/#.*$/,'');
  const p=new URLSearchParams({dossier:r.num,type:t,date:(t==='entree'?r.debut:r.fin).slice(0,10),salles:salleNames(r)});
  const url=base+'#'+p.toString(),entree=t==='entree';
  const text=`Bonjour,
Pouvez-vous faire l’état des lieux ${entree?'d’entrée':'de sortie'} de la salle des fêtes de ${s.commune} ?

Dossier : ${r.num}
Salle(s) : ${salleNames(r)}
${entree?'Début':'Fin'} de la location : ${fmtLong(entree?r.debut:r.fin)}

Ouvrez ce lien dans l’application d’état des lieux :
${url}

Ensuite, envoyez le document (bouton Partager) à la mairie par la messagerie de la mairie, pas par WhatsApp.
Merci.`;
  return{subject:`État des lieux ${entree?'d’entrée':'de sortie'} – ${r.num}`,text,url};
}
function contratHtml(r){
  const s=S.db.settings,m=money(r);
  const map={commune:s.commune,signataire:s.signataire||'le Maire',num:r.num,nom:r.demandeur.nom,adresse:r.demandeur.adresse||'—',tel:r.demandeur.tel||'—',email:r.demandeur.email||'—',
    salles:salleNames(r),type:r.type.toLowerCase(),debut:fmtLong(r.debut),fin:fmtLong(r.fin),loyer:eur(m.base),
    options:r.options.map(id=>s.options.find(o=>o.id===id)?.nom).filter(Boolean).join(', ')||'aucune',optionsPrix:eur(m.opt),total:eur(m.total),caution:eur(m.caution),
    contact:s.mairieContact?` (${s.mairieContact})`:''};
  const body=esc(s.contrat).replace(/\{\{(\w+)\}\}/g,(x,k)=>k in map?esc(map[k]):x);
  return`<h1>Contrat de location de la salle des fêtes</h1><p style="text-align:center;margin:0 0 14pt">Commune de ${esc(s.commune)} · Dossier ${esc(r.num)}</p><div class="body">${body}</div>
  <p style="margin-top:18pt">Fait à ${esc(s.commune)}, le ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}, en deux exemplaires.</p>
  <div class="sig"><div>Le locataire<br><small>(lu et approuvé)</small></div><div>Pour la commune<br><small>${esc(s.signataire||'Le Maire')}</small></div></div>`;
}
function icsAnon(){
  const f=d=>{const x=new Date(d);return `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;};
  const ev=S.db.resas.filter(r=>r.statut!=='annulee').map(r=>`BEGIN:VEVENT\r\nUID:${r.id}@salle-des-fetes\r\nDTSTAMP:${f(new Date())}\r\nDTSTART:${f(r.debut)}\r\nDTEND:${f(r.fin)}\r\nSUMMARY:${salleNames(r)} - ${r.statut==='confirmee'?'Réservée':'En attente'} (${r.num})\r\nEND:VEVENT`);
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Salle des fetes//FR\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR`;
}
async function backup(){
  const out={app:'sdf-reservations',v:1,kv:{}};
  for(const k of await kvKeys()){const v=await kvGet(k);out.kv[k]=k==='meta'?v:toB64(v);}
  download(`sauvegarde-salle-des-fetes-${ymd(new Date())}.json`,JSON.stringify(out),'application/json');toast('Sauvegarde exportée.');
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  try{
  switch(a){
    case 'setup':{const p1=$('#pw1').value,p2=$('#pw2').value;if(p1.length<8)return toast('Le code doit contenir au moins 8 caractères.');if(p1!==p2)return toast('Les deux codes sont différents.');
      el.disabled=true;S.rec=await setupCode(p1);S.lock='showrec';render();break;}
    case 'recDone':if(!$('#recok').checked)return toast('Cochez la case après avoir noté le code.');S.rec=null;S.lock=null;arm();render();break;
    case 'printRec':$('#print').innerHTML=`<h1>Code de récupération</h1><p style="text-align:center;font-size:20pt;font-family:monospace;margin:30pt 0">${esc(S.rec)}</p><p>Réservations de la salle des fêtes. À conserver en lieu sûr, séparément de l’appareil.</p>`;window.print();break;
    case 'unlock':{el.disabled=true;const ok=await tryUnlock($('#pw').value);el.disabled=false;if(!ok)return toast('Code incorrect.');S.lock=null;arm();render();break;}
    case 'goRecover':S.lock='recover';render();break;
    case 'goUnlock':S.lock='unlock';render();break;
    case 'recover':{const n=$('#pwn').value;if(n.length<8)return toast('Le nouveau code doit contenir au moins 8 caractères.');el.disabled=true;const ok=await tryRecover($('#rec').value,n);el.disabled=false;if(!ok)return toast('Code de récupération incorrect.');S.lock=null;arm();render();toast('Nouveau code d’accès enregistré.');break;}
    case 'lock':lockNow();break;
    case 'tab':flush();S.tab=el.dataset.t;render();break;
    case 'prev':S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);render();break;
    case 'next':S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);render();break;
    case 'today':{const d=new Date();S.month=new Date(d.getFullYear(),d.getMonth(),1);render();break;}
    case 'day':S.sheet=el.dataset.d;render();break;
    case 'closeSheet':if(el.classList.contains('overlay')&&e.target!==el)break;S.sheet=null;render();break;
    case 'new':S.edit=newResa(el.dataset.d);S.sheet=null;S.newFiles=[];S.delFiles=[];render();break;
    case 'open':S.edit=clone(S.db.resas.find(r=>r.id===id));S.sheet=null;S.newFiles=[];S.delFiles=[];render();break;
    case 'cancelEdit':for(const f of S.newFiles)await kvDel('f:'+f);S.edit=null;S.newFiles=[];S.delFiles=[];render();break;
    case 'save':await saveResa();break;
    case 'del':if(confirm('Supprimer définitivement cette réservation et ses documents ?')){const r=S.db.resas.find(x=>x.id===S.edit.id);for(const p of r.pdfs)await kvDel('f:'+p.id);for(const f of S.newFiles)await kvDel('f:'+f);S.db.resas=S.db.resas.filter(x=>x.id!==r.id);await saveDb();S.edit=null;render();toast('Réservation supprimée.');}break;
    case 'autoMoney':S.edit.loyerManuel=null;S.edit.cautionManuelle=null;render();break;
    case 'contrat':{const r=S.edit;if(!r.demandeur.nom.trim())return toast('Indiquez le nom du demandeur.');$('#print').innerHTML=contratHtml(r.num?r:{...r,num:'(à numéroter)'});window.print();break;}
    case 'edl':{if(!S.edit.num)return toast('Enregistrez d’abord la fiche pour obtenir le numéro de dossier.');
      const msg=edlMessage(S.edit,el.dataset.t),c=S.db.settings.agentContact.trim(),q=encodeURIComponent;
      if(c){location.href=c.includes('@')?`mailto:${c}?subject=${q(msg.subject)}&body=${q(msg.text)}`:`sms:${c.replace(/\s/g,'')}?&body=${q(msg.text)}`;}
      else if(navigator.share){try{await navigator.share({title:msg.subject,text:msg.text});}catch(x){if(x.name!=='AbortError')throw x;}}
      else{try{await navigator.clipboard.writeText(msg.text);toast('Message copié. Collez-le dans un e-mail ou un SMS.');}catch(x){prompt('Copiez ce message :',msg.text);}}
      break;}
    case 'pdfFiche':S.pdfTarget='fiche';$('#pdfIn').click();break;
    case 'pdfAuto':S.pdfTarget='auto';$('#pdfIn').click();break;
    case 'pdfOpen':{const p=S.edit.pdfs.find(x=>x.id===id);await openPdf(id,p.name);break;}
    case 'pdfDel':if(confirm('Retirer ce document de la fiche ?')){S.edit.pdfs=S.edit.pdfs.filter(x=>x.id!==id);S.delFiles.push(id);render();}break;
    case 'addOpt':S.db.settings.options.push({id:uid(),nom:'Nouvelle option',prix:0});await saveDb();render();break;
    case 'delOpt':{const o=S.db.settings.options[+el.dataset.i];if(confirm(`Supprimer l’option « ${o.nom} » ?`)){S.db.settings.options.splice(+el.dataset.i,1);await saveDb();render();}break;}
    case 'resetContrat':if(confirm('Remplacer le modèle actuel par le modèle initial ?')){S.db.settings.contrat=DEFAULT_CONTRAT;await saveDb();render();}break;
    case 'anonym':{const l=eligible();if(l.length&&confirm(`Anonymiser ${l.length} fiche(s) ? Cette action est définitive.`)){
      for(const r of l){for(const p of r.pdfs)await kvDel('f:'+p.id);r.pdfs=[];r.demandeur={nom:'(anonymisé)',adresse:'',tel:'',email:''};r.notes='';r.anonyme=true;}
      await saveDb();render();toast('Fiches anonymisées.');}break;}
    case 'ics':download('calendrier-salle-des-fetes.ics',icsAnon(),'text/calendar');break;
    case 'csv':{const rows=[['Numéro','Salles','Début','Fin','Statut'],...S.db.resas.filter(r=>r.statut!=='annulee').map(r=>[r.num,salleNames(r),r.debut.replace('T',' '),r.fin.replace('T',' '),STATUTS[r.statut]])];
      download('reservations-salle-des-fetes.csv','\ufeff'+rows.map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n'),'text/csv');break;}
    case 'backup':await flush();await backup();break;
    case 'restore':$('#restoreIn').click();break;
    case 'chgpw':{const n=$('#newpw').value;if(n.length<8)return toast('Le code doit contenir au moins 8 caractères.');S.meta=await wrapMeta(S.raw,n,null,S.meta);$('#newpw').value='';toast('Code d’accès modifié.');break;}
  }
  }catch(err){console.error(err);toast('Une erreur est survenue. Réessayez.');}
});

/* Saisie : les champs texte mettent à jour l'état sans redessiner (pas de perte de focus) */
function readVal(t){return t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?null:Number(t.value)):t.value;}
function onField(e){
  const t=e.target;
  if(t.dataset.arr&&S.edit){if(e.type!=='change')return;const arr=S.edit[t.dataset.arr],v=t.dataset.val,i=arr.indexOf(v);
    if(t.checked&&i<0)arr.push(v);if(!t.checked&&i>=0)arr.splice(i,1);render();return;}
  if(t.dataset.f&&S.edit){
    if(t.dataset.r&&e.type!=='change')return;
    setPath(S.edit,t.dataset.f,readVal(t));
    if(t.dataset.r)render();
    else if(t.dataset.live){const m=money(S.edit);$('#tot').textContent=eur(m.total);}
    return;}
  if(t.dataset.s&&S.db){let v=readVal(t);if(t.type==='number')v=v??0;setPath(S.db.settings,t.dataset.s,v);S.dirty=true;if(e.type==='change')saveDb();return;}
  if(t.id==='q'){S.filt.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return;}
  if(t.dataset.flt&&e.type==='change'){S.filt[t.dataset.flt]=t.value;render();}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['pw','pw1','pw2','rec','pwn'].includes(e.target.id)){$('.lock .btn.pri')?.click();}});

$('#pdfIn').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length||!S.key)return;
  try{
    if(S.pdfTarget==='fiche'&&S.edit){for(const f of files)S.newFiles.push(await attachPdf(f,S.edit));render();toast('Document ajouté. Pensez à enregistrer.');return;}
    let ok=0,ko=[];
    for(const f of files){const m=f.name.match(/SDF-\d{4}-\d{3}/i);const r=m&&S.db.resas.find(x=>x.num.toUpperCase()===m[0].toUpperCase());
      if(r){await attachPdf(f,r);ok++;}else ko.push(f.name);}
    await saveDb();render();
    toast(ko.length?`${ok} rattaché(s). Numéro de dossier introuvable dans : ${ko.join(', ')}`:`${ok} document(s) rattaché(s) aux fiches.`);
  }catch(err){console.error(err);toast('Import impossible.');}
});
$('#restoreIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());if(o.app!=='sdf-reservations'||!o.kv?.meta||!o.kv?.data)throw new Error('format');
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ? Le code d’accès de la sauvegarde sera demandé.'))return;
    await kvClear();for(const [k,v] of Object.entries(o.kv))await kvSet(k,k==='meta'?v:fromB64(v));
    S.meta=o.kv.meta;S.key=null;S.raw=null;S.db=null;S.edit=null;S.lock='unlock';render();toast('Sauvegarde restaurée. Saisissez son code d’accès.');
  }catch(err){console.error(err);toast('Fichier de sauvegarde non reconnu.');}
});

/* Verrouillage automatique après 10 minutes d'inactivité */
let idle;function arm(){clearTimeout(idle);if(S.key)idle=setTimeout(lockNow,10*60*1000);}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,arm,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});
window.addEventListener('pagehide',flush);

/* Installation et mode hors connexion : uniquement quand la page est servie en ligne (https), pas depuis un fichier local */
if(location.protocol==='https:'||location.hostname==='localhost'){
  [['manifest','manifest.webmanifest'],['apple-touch-icon','apple-touch-icon.png']].forEach(([rel,href])=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l);});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* Démarrage */
(async()=>{
  if(!window.crypto?.subtle||!window.indexedDB){$('#app').innerHTML='<div class="lock"><h1>Navigateur non compatible</h1><p>Ouvrez cette application avec un navigateur récent, depuis une adresse https.</p></div>';return;}
  S.meta=await kvGet('meta');S.lock=S.meta?'unlock':'setup';render();
})();
</script>
